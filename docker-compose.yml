  # === Go API ===
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pelvictrainer-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      PORT: ${PORT:-8080}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      DATABASE_URL: postgres://${POSTGRES_USER:-pelvictrainer}:${POSTGRES_PASSWORD:-pelvictrainer_password}@postgres:5432/${POSTGRES_DB:-pelvictrainer}?sslmode=disable
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production-2026}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:8080}
      
      # === EMAIL: MAIL.RU через порт 2525 ===
      SMTP_HOST: ${SMTP_HOST:-smtp.mail.ru}
      SMTP_PORT: ${SMTP_PORT:-2525}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-pelvictrainer@mail.ru}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-PelvicTrainer}
    ports:
      - "8080:8080"
    networks:
      - pelvic-network