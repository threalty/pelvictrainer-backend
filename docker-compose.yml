services:
  # ===== PostgreSQL =====
  postgres:
    image: postgres:16-alpine
    container_name: pelvic-postgres
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      TZ: ${TZ}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always
    networks:
      - pelvic-net
    deploy:
      resources:
        limits:
          memory: 512M

  # ===== Redis =====
  redis:
    image: redis:7-alpine
    container_name: pelvic-redis
    command: redis-server --requirepass ${REDIS_PASSWORD} --maxmemory 128mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"
    restart: always
    networks:
      - pelvic-net
    deploy:
      resources:
        limits:
          memory: 256M

  # ===== Adminer (Web UI для PostgreSQL) =====
  adminer:
    image: adminer:latest
    container_name: pelvic-adminer
    ports:
      - "127.0.0.1:8080:80"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    depends_on:
      - postgres
    restart: always
    networks:
      - pelvic-net

volumes:
  postgres_data:
  redis_data:

networks:
  pelvic-net:
    driver: bridge