services:
  # ===== Go API =====
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pelvic-api
    environment:
      - PORT=8080
      - DATABASE_URL=postgres://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}?sslmode=disable
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379
      - JWT_SECRET=${JWT_SECRET}
      - ENVIRONMENT=production
      - GIN_MODE=release
    ports:
      - "127.0.0.1:8081:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: always
    networks:
      - pelvic-net
    deploy:
      resources:
        limits:
          memory: 256M

  # ===== PostgreSQL =====
  postgres:
      image: postgres:16-alpine
      container_name: pelvic-postgres
      environment:
        POSTGRES_DB: ${DB_NAME}
        POSTGRES_USER: ${DB_USER}
        POSTGRES_PASSWORD: ${DB_PASSWORD}
        TZ: ${TZ}
      volumes:
        - postgres_data:/var/lib/postgresql/data
        - ./db/init:/docker-entrypoint-initdb.d  # ← Добавили эту строку
      ports:
        - "127.0.0.1:5432:5432"
      healthcheck:
        test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
        interval: 10s
        timeout: 5s
        retries: 5
      restart: always
      networks:
        - pelvic-net
      deploy:
        resources:
          limits:
            memory: 512M

  # ===== Redis =====
  redis:
    image: redis:7-alpine
    container_name: pelvic-redis
    command: redis-server --requirepass ${REDIS_PASSWORD} --maxmemory 128mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"
    restart: always
    networks:
      - pelvic-net
    deploy:
      resources:
        limits:
          memory: 256M

  # ===== Adminer =====
  adminer:
    image: adminer:latest
    container_name: pelvic-adminer
    ports:
      - "127.0.0.1:8080:80"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    depends_on:
      - postgres
    restart: always
    networks:
      - pelvic-net

volumes:
  postgres_data:
  redis_data:

networks:
  pelvic-net:
    driver: bridge