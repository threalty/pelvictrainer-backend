services:
  postgres:
    image: postgres:16-alpine
    container_name: pelvictrainer-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pelvictrainer}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pelvictrainer_password}
      POSTGRES_DB: ${POSTGRES_DB:-pelvictrainer}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pelvictrainer}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - pelvic-network

  redis:
    image: redis:7-alpine
    container_name: pelvictrainer-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - pelvic-network

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pelvictrainer-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      PORT: "8080"
      ENVIRONMENT: ${ENVIRONMENT:-production}
      DATABASE_URL: postgres://${POSTGRES_USER:-pelvictrainer}:${POSTGRES_PASSWORD:-pelvictrainer_password}@postgres:5432/${POSTGRES_DB:-pelvictrainer}?sslmode=disable
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production-2026}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:8080}
      SMTP_HOST: ${SMTP_HOST:-smtp.mail.ru}
      SMTP_PORT: ${SMTP_PORT:-2525}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-pelvictrainer@mail.ru}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-PelvicTrainer}
    ports:
      - "8081:8080"
    networks:
      - pelvic-network

  admin:
    build:
      context: ./admin-frontend
      dockerfile: Dockerfile
    container_name: pelvictrainer-admin
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "3000:80"
    networks:
      - pelvic-network

networks:
  pelvic-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data: